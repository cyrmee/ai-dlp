# ai-dlp detection rules: the full gitleaks default rule set, plus extras for
# secrets gitleaks' defaults let through (low-entropy passwords, URL credentials).
# Add your own rules below in standard gitleaks format; the proxy reloads this
# file automatically when it changes.

title = "ai-dlp"

[extend]
useDefault = true

# scheme://user:PASSWORD@host  (e.g. postgres://app:<password>@db:5432/app)
# Placeholders such as ${DB_PASS}, <password>, password, secret, changeme or **** (as in
# READMEs, .env.example and docker-compose files) are not matched.
[[rules]]
id = "url-password"
description = "Password embedded in a connection URL"
regex = '''(?i)[a-z][a-z0-9+.\-]{1,20}://[^\s:/@"'\\]{1,64}:([^\s@/"'\\$<>{}]{3,128})@'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(password|passwd|pass|pwd|secret|changeme|change_me|example|placeholder|redacted|(your|my)[_-]?(password|passwd|pass|secret|token|key|api[_-]?key|value)|x+|\*+|\.+)$''']

# password = "<value>", DB_PASSWORD=<value>, secret: <value>, client_secret: <value>
# Values of 4+ characters: quoted, or unquoted at the end of a line. ${VAR} references,
# code such as `password = request.getPassword();` and placeholders such as null,
# none, true, changeme, **** or <value> are not matched.
[[rules]]
id = "password-assignment"
description = "Password or secret assigned in config, env or code"
regex = '''(?i)(?:password|passwd|pwd|secret)["']?[ \t]{0,3}[:=][ \t]{0,3}(?:"([^"\s$]{4,200})"|'([^'\s$]{4,200})'|([^\s"'$\{\(\);,]{4,200})(?:[\r\n]|$))'''
keywords = ["password", "passwd", "pwd", "secret"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(null|none|nil|true|false|undefined|empty|string|required|optional|changeme|change_me|password|passwd|secret|example|placeholder|redacted|(your|my)[_-]?(password|passwd|pass|secret|token|key|api[_-]?key|value)|x+|\*+|\.+|<[^>]*>)$''']

# --- Fayda national ID numbers (personal data) -------------------------------------
# Matched only as stand-alone numbers: not when attached to letters, dots or hyphens, so
# UUIDs, version numbers, timestamps and longer numbers are left alone. FIN/UIN and
# FAN/VID are also matched in groups of four ("1234 5678 9012").
[[rules]]
id = "fayda-regid"
description = "Fayda registration ID (RID, 29 digits)"
regex = '''(?:^|[^0-9A-Za-z_.\-])([0-9]{29})(?:$|[^0-9A-Za-z_.\-]|\.(?:$|[^0-9]))'''
secretGroup = 1

[[rules]]
id = "fayda-fan-vid"
description = "Fayda FAN or VID (16 digits)"
regex = '''(?:^|[^0-9A-Za-z_.\-])([0-9]{16}|[0-9]{4}[ \-][0-9]{4}[ \-][0-9]{4}[ \-][0-9]{4})(?:$|[^0-9A-Za-z_.\-]|\.(?:$|[^0-9]))'''
secretGroup = 1

[[rules]]
id = "fayda-fin-uin"
description = "Fayda FIN or UIN (12 digits)"
regex = '''(?:^|[^0-9A-Za-z_.\-])([0-9]{12}|[0-9]{4}[ \-][0-9]{4}[ \-][0-9]{4})(?:$|[^0-9A-Za-z_.\-]|\.(?:$|[^0-9]))'''
secretGroup = 1
